<!doctype html>
<html lang="fr" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Votre guide</title>
<meta name="theme-color" content="#0f0d0b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/c.css">
<style>
.w{max-width:900px;margin:0 auto;padding:22px 16px 80px}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:999px;background:rgba(18,13,10,.6);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:40}
.gtop .acts{display:flex;gap:6px}
.gbtn[hidden]{display:none}
.gbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--glass);color:var(--ink);font:600 13.5px var(--body);text-decoration:none;cursor:pointer;transition:border-color .3s,background .3s,transform .3s var(--spring)}
.gbtn:hover{border-color:var(--oline);background:var(--osoft);transform:translateY(-1px)}
@media (max-width:520px){.gbtn .t{display:none}.gbtn{padding:9px 11px}}
.state{margin-top:40px;border-radius:28px;padding:44px 24px;border:1px solid var(--line);background:var(--panel);text-align:center;animation:pop .6s var(--spring)}
.state h1{font-size:clamp(26px,4.4vw,40px);margin:14px 0 10px}
.state p{color:var(--ink-2);margin:0 auto 22px;max-width:520px}
.state .ic{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--osoft);border:1px solid var(--oline)}
.state .ic .sp{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,138,76,.25);border-top-color:var(--o2);animation:rot .8s linear infinite}
.hero-g{margin-top:34px;text-align:left}
.hero-g .label{margin-bottom:14px}
.hero-g h1{font-size:clamp(32px,5.6vw,58px);line-height:1.02}
.hero-g p{color:var(--ink-2);max-width:640px;margin:14px 0 0}
.toc{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:24px -16px 0;padding:4px 16px 6px}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink-2);font-size:13.5px;text-decoration:none;white-space:nowrap;transition:all .3s var(--spring)}
.toc a b{color:var(--o2);font-weight:700}
.toc a:hover,.toc a.on{border-color:var(--oline);background:var(--osoft);color:var(--ink)}
.paper{margin-top:18px;border-radius:30px;padding:clamp(22px,4.4vw,52px);background:#f5f1ea;color:#15110d;box-shadow:0 50px 100px -40px rgba(0,0,0,.9)}
.eb{max-width:760px;margin:0 auto}
.eb h2,.eb h3,.eb h4{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;color:#15110d}
.eb-cover{border-bottom:2px solid #e2dace;padding-bottom:22px;margin-bottom:6px}
.eb-tag,.eb-n{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b53a0f}
.eb-cover h3{font-size:clamp(26px,4vw,38px);line-height:1.08;margin:8px 0 10px}
.eb-cover p{color:#4a433c;margin:0}
.eb-plan{margin:18px 0 4px;padding:18px 20px;border-radius:18px;background:#fff;border:2px solid #ff5a1f}
.eb-plan h2,.eb-plan h4{font-size:22px;margin:4px 0 6px}
.eb-plan p{color:#3b352f;margin:6px 0 0}
.eb-ch{padding-block:26px;border-bottom:1px solid #e2dace;scroll-margin-top:90px;opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.eb-ch.in,.no-js .eb-ch{opacity:1;transform:none}
.eb-ch h2,.eb-ch h4{font-size:clamp(20px,3vw,25px);margin:4px 0 10px}
.eb-ch p{color:#3b352f}
.eb-ch ul,.eb-ch ol{padding-left:22px;color:#3b352f}
.eb-ch li{margin:6px 0}
.eb-no li::marker{color:#b3261e}.eb-ok li::marker{color:#1f8a4c}
.eb-q li::marker{color:#d9481a;font-weight:700}
.eb-calc{border-radius:14px;background:#fff;border:1px solid #e2dace;padding:12px 16px;margin:12px 0;max-width:460px}
.eb-calc div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #e2dace;font-variant-numeric:tabular-nums}
.eb-calc div.m b{color:#b3261e}
.eb-calc div.t{border:0;font-family:var(--display);font-size:22px}.eb-calc div.t b{color:#1f8a4c}
.eb-formula{font-family:var(--display);font-size:19px;padding:12px 16px;border-radius:12px;background:#fff;border:1px solid #e2dace;display:inline-block}
.eb-tw{overflow-x:auto;margin:10px 0}
.eb-t{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff;border-radius:12px;overflow:hidden;min-width:460px}
.eb-t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6b635b;padding:10px;border-bottom:1px solid #e2dace}
.eb-t td{padding:9px 10px;border-bottom:1px solid #efe8de;vertical-align:top}
.eb-t tr:hover td{background:#fbf8f3}
.eb-t td.no{color:#b3261e}
.eb-small{font-size:13px;color:#5f574f}
.eb-end{background:none;border-top:0;padding-bottom:0;font-size:inherit;color:inherit}
.eb h2{line-height:inherit;letter-spacing:inherit}
.eb-tw:focus-visible{outline:2px solid #b53a0f;outline-offset:2px}
.eb-sc{margin:12px 0;padding:14px 16px;border-radius:14px;background:#15110d;color:#f4f1ec}.eb-sc span{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#ff8a4c;margin-bottom:6px}.eb-sc p{margin:0;color:#f4f1ec!important;font-size:15.5px;line-height:1.55}.eb-bx{margin:14px 0;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid #e2dace;border-left:4px solid #1f8a4c}.eb-bx.w{border-left-color:#d9481a;background:#fff8f3}.eb-bx>b{display:block;font-family:var(--display);font-size:17px;margin-bottom:4px}.eb-bx p,.eb-bx ul{margin:6px 0 0}.eb-cover .eb-small{margin-top:10px}
.eb-end{padding-top:24px}.eb-end h2,.eb-end h4{font-size:22px;margin-bottom:8px}.eb-end p{color:#3b352f}
.after{margin-top:20px;border-radius:26px;padding:28px 22px;border:1px solid var(--oline);background:linear-gradient(160deg,rgba(255,90,31,.16),rgba(255,90,31,.03));text-align:center}
.after h2{font-size:clamp(22px,3vw,28px)}
.after p{color:var(--ink-2);margin:8px auto 18px;max-width:520px}
.msg{font-size:14px;color:#ff9b8a;margin-top:10px;min-height:1em}
.foot{margin-top:26px;font-size:13px;color:var(--ink-3);text-align:center}
@media print{
  body{background:#fff!important;color:#15110d}
  .bg,.spot,.progress,.gtop,.toc,.after,.foot,.totop,.hero-g .label{display:none!important}
  .w{padding:0}.hero-g{margin:0 0 10px}.hero-g h1{color:#15110d;font-size:28px}.hero-g p{color:#3b352f}
  .paper{box-shadow:none;border-radius:0;padding:0}
  .eb-ch{opacity:1;transform:none}
  .eb-ch h2,.eb-sc,.eb-bx,.eb-calc,.eb-t tr{break-inside:avoid}
  .eb-ch h2{break-after:avoid}
  .eb-sc{background:#fff;color:#15110d;border:1px solid #15110d}
  .eb-sc p{color:#15110d!important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="grid"></div><div class="orb o1"></div><div class="orb o2"></div><div class="grain"></div></div>
<div class="spot" aria-hidden="true"></div>
<div class="progress" aria-hidden="true"></div>
<div class="w">
  <header class="gtop">
    <a class="brand" data-home href="/" aria-label="Retour au site"><span class="mk"><svg viewBox="282 812 1370 305" aria-hidden="true"><path d="M292 1102 C380 1020 500 975 628 970 C760 880 880 828 1030 828 C1160 828 1280 868 1393 912 L1277 972 C1100 1000 880 1015 700 1017 C560 1019 450 1040 388 1102 Z M710 970 C800 910 900 870 1020 870 C1100 870 1180 887 1242 905 C1216 929 1192 939 1170 942 C1030 960 860 970 710 970 Z" fill="#f4f1ec" fill-rule="evenodd"/><path d="M1102 1102 L1297 1102 L1640 830 L1425 862 L1503 896 Z" fill="#ff5a1f"/><path d="M1490 997 L1553 946 C1561 962 1546 986 1552 1010 C1564 1048 1570 1080 1561 1103 L1554 1103 C1540 1062 1520 1030 1490 997 Z" fill="#ff5a1f"/></svg></span><span id="brand">utopicar</span></a>
    <div class="acts"><button class="gbtn" id="print" type="button" aria-label="Enregistrer le guide en PDF" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg><span class="t">Enregistrer en PDF</span></button><a class="gbtn" data-home href="/" aria-label="Retour au site"><span class="t">Retour au site</span><span aria-hidden="true">&#8599;</span></a></div>
  </header>

  <main>
    <div id="load" class="state" role="status"><div class="ic"><span class="sp"></span></div><h1 id="loadh">Ouverture du guide…</h1><p id="loadp">Vérification du lien personnel.</p></div>

    <div id="err" class="state" hidden><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ff8a4c" stroke-width="2.4" aria-hidden="true"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg></div><h1 id="errh">Ce lien ne marche plus</h1><p id="errtxt"></p><a class="btn btn-o" data-home href="/"><span class="lbl" id="errbtn">Recevoir un nouveau lien</span><span class="arr" aria-hidden="true">&#8594;</span></a></div>

    <div id="stop" class="state" hidden><div class="check"><svg viewBox="0 0 24 24" aria-hidden="true" style="stroke-dashoffset:0"><path d="m5 12 5 5L20 7"/></svg></div><h1>C'est fait</h1><p id="stoptxt"></p><a class="btn btn-ghost" data-home href="/">Retour au site</a></div>

    <div id="ok" hidden>
      <section class="hero-g"><span class="label" id="glabel">Guide personnel</span><h1 id="gtitre"></h1><p id="gsub"></p><nav class="toc" id="toc" aria-label="Sommaire"></nav></section>
      <article class="paper" id="contenu"></article>
      <section class="after" id="after" hidden><h2>L'ebook complet arrive</h2><p>Il est en cours d'écriture et sortira à <b>5 €</b>. Tu veux être prévenu le jour du lancement ?</p><button class="btn btn-o" id="wl" type="button"><span class="spin" aria-hidden="true"></span><span class="lbl">Me prévenir du lancement</span></button><div class="msg" id="wlmsg" role="status" aria-live="polite"></div></section>
      <p class="foot" id="foot"></p>
    </div>
  </main>
</div>
<button class="totop" type="button" aria-label="Revenir en haut"><svg class="r" viewBox="0 0 52 52" aria-hidden="true"><circle class="t1" cx="26" cy="26" r="24"/><circle class="t2" cx="26" cy="26" r="24"/></svg><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
<script>window.UC_SITE={site:/^\/benef(\/|$)/.test(location.pathname)?'ebook':'utopicar',tu:/^\/benef(\/|$)/.test(location.pathname)}</script>
<script src="/c.js"></script>
<script>
(function(){
  var FN='https://rvdfifhgosovdapdltps.supabase.co/functions/v1/inscription';
  var $=function(id){return document.getElementById(id)};
  var TU=window.UC_SITE.tu;
  function base(eb){document.querySelectorAll('a[data-home]').forEach(function(a){a.setAttribute('href',eb?'/benef':'/')});}
  var T=function(v,t){return TU?t:v};
  $('brand').textContent=TU?'Bénef':'utopicar'; base(TU);
  document.title=T('Votre guide','Ton guide');
  var q=new URLSearchParams(location.search);
  function show(id){['load','err','stop','ok'].forEach(function(k){$(k).hidden=(k!==id)})}
  function fail(txt){ show('err'); $('errtxt').textContent=txt||T("Il a peut-être expiré. Inscrivez-vous à nouveau : vous recevrez un nouveau lien par email.","Il a peut-être expiré. Inscris-toi à nouveau : tu recevras un nouveau lien par email."); }
  function post(body){ return fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(d){return {r:r,d:d}}).catch(function(){return {r:r,d:{}}})}); }

  // Désinscription depuis le lien en bas des emails
  var s=q.get('stop');
  if(s){
    try{history.replaceState(null,'',location.pathname)}catch(e){}
    $('loadh').textContent='Désinscription…'; $('loadp').textContent='';
    post({action:'stop',s:s}).then(function(x){
      if(x.r.ok&&x.d.ok){ show('stop'); $('stoptxt').textContent=T("Vous ne recevrez plus de messages de notre part. Vos données seront supprimées lors de la prochaine purge.","Tu ne recevras plus de messages de notre part. Tes données seront supprimées lors de la prochaine purge."); }
      else fail(T("Ce lien de désinscription n'est pas valide.","Ce lien de désinscription n'est pas valide."));
    }).catch(function(){ fail(T("Connexion impossible pour le moment. Réessayez dans un instant.","Connexion impossible pour le moment. Réessaie dans un instant.")); });
    return;
  }

  var t=q.get('t')||'';
  try{ if(t){ sessionStorage.setItem('gt',t); history.replaceState(null,'',location.pathname); } else { t=sessionStorage.getItem('gt')||''; } }catch(e){}
  if(!/^[A-Za-z0-9_-]{40,}$/.test(t)){ $('errh').textContent=T('Guide réservé aux inscrits','Guide réservé aux inscrits'); $('errbtn').textContent=T('Recevoir le guide','Recevoir le guide'); fail(T("Ce guide s'ouvre uniquement depuis le lien reçu par email. Inscrivez-vous pour le recevoir.","Ce guide s'ouvre uniquement depuis le lien reçu par email. Inscris-toi pour le recevoir.")); return; }

  post({action:'lire',t:t}).then(function(x){
    if(!(x.r.ok&&x.d.ok)){ fail(x.d.erreur==='limite'?T("Ce lien a été ouvert trop de fois. Inscrivez-vous à nouveau pour en recevoir un nouveau.","Ce lien a été ouvert trop de fois. Inscris-toi à nouveau pour en recevoir un nouveau."):null); return; }
    var eb=x.d.site==='ebook'; TU=eb; window.UC_SITE.tu=eb;
    document.title=x.d.titre||document.title;
    $('brand').textContent=eb?'Bénef':'utopicar'; base(eb);
    $('gtitre').innerHTML='';
    $('gtitre').textContent=x.d.titre||'';
    $('glabel').textContent=T('Guide personnel de '+x.d.prenom,'Guide personnel de '+x.d.prenom);
    $('contenu').innerHTML=x.d.contenu;
    [].slice.call($('contenu').querySelectorAll('h4')).forEach(function(h){var n=document.createElement('h2');n.className=h.className;n.innerHTML=h.innerHTML;h.parentNode.replaceChild(n,h)});
    [].slice.call($('contenu').querySelectorAll('.eb-tw')).forEach(function(w){w.tabIndex=0;w.setAttribute('role','region');var c=w.closest('.eb-ch'),h=c&&c.querySelector('h2');w.setAttribute('aria-label','Tableau'+(h?' : '+h.textContent:''))});
    var cov=$('contenu').querySelector('.eb-cover'); if(cov){ var cp=cov.querySelector('p'); if(cp) $('gsub').textContent=cp.textContent; cov.remove(); }
    $('foot').textContent=T("Ce lien est personnel. Gardez l'email pour revenir sur votre guide.","Ce lien est personnel. Garde l'email pour revenir sur ton guide.");
    $('after').hidden=!eb; $('print').hidden=false;
    // Sommaire + révélation au scroll + chapitre actif
    var chs=[].slice.call($('contenu').querySelectorAll('.eb-ch')), toc=$('toc');
    chs.forEach(function(c,i){ c.id='ch'+(i+1); var n=c.querySelector('.eb-n'), h=c.querySelector('h2,h4'); var a=document.createElement('a'); a.href='#'+c.id; a.innerHTML='<b></b><span></span>'; a.firstChild.textContent=n?n.textContent:''; a.lastChild.textContent=h?h.textContent:''; toc.appendChild(a); });
    var links=[].slice.call(toc.querySelectorAll('a'));
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -6% 0px',threshold:.05});
      chs.forEach(function(c){io.observe(c)});
    } else chs.forEach(function(c){c.classList.add('in')});
    var tick=false;
    addEventListener('scroll',function(){ if(tick) return; tick=true; requestAnimationFrame(function(){ tick=false; var cur=-1; chs.forEach(function(c,i){ if(c.getBoundingClientRect().top<innerHeight*.4) cur=i; }); links.forEach(function(a,i){ var on=i===cur; if(on!==a.classList.contains('on')){ a.classList.toggle('on',on); if(on&&a.scrollIntoView) toc.scrollTo({left:a.offsetLeft-16,behavior:'smooth'}); } }); }); },{passive:true});
    show('ok');
  }).catch(function(){ fail(T("Connexion impossible pour le moment. Réessayez dans un instant.","Connexion impossible pour le moment. Réessaie dans un instant.")); });

  $('print').addEventListener('click',function(){ document.querySelectorAll('.eb-ch').forEach(function(c){c.classList.add('in')}); window.print(); });
  $('wl').addEventListener('click',function(){
    var b=$('wl'); b.disabled=true; b.classList.add('loading');
    post({action:'liste_ebook',t:t}).then(function(x){ if(!(x.r.ok&&x.d.ok)) throw 0; b.classList.remove('loading'); b.querySelector('.lbl').textContent='C’est noté, tu seras prévenu'; $('wlmsg').textContent=''; var r=b.getBoundingClientRect(); window.UC_confetti&&UC_confetti(r.left+r.width/2,r.top+r.height/2); })
      .catch(function(){ b.disabled=false; b.classList.remove('loading'); $('wlmsg').textContent="Ça n'a pas marché. Réessaie dans un instant."; });
  });
})();
</script>
</body>
</html>

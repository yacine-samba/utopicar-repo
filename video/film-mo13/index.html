<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MO13 · Avec 1 500 €</title>
<style>
@font-face{font-family:Clash;font-weight:700;src:url(../assets/fonts-site/ClashDisplay-700.woff2) format('woff2')}
@font-face{font-family:Clash;font-weight:600;src:url(../assets/fonts-site/ClashDisplay-600.woff2) format('woff2')}
@font-face{font-family:Satoshi;font-weight:500;src:url(../assets/fonts-site/Satoshi-500.woff2) format('woff2')}
@font-face{font-family:Satoshi;font-weight:700;src:url(../assets/fonts-site/Satoshi-700.woff2) format('woff2')}
@font-face{font-family:Fraunces;font-style:italic;src:url(../assets/fonts-mo5/Fraunces.woff2) format('woff2')}
:root{--bg0:#08070a;--o1:#ff5a1f;--o2:#ff8a4c;--o3:#ffb38a;--ink:#f6efe7;--mute:#a59a90}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg0)}
#stage{position:absolute;inset:0;overflow:hidden;color:var(--ink);font-family:Satoshi;-webkit-font-smoothing:antialiased;background:var(--bg0)}
.L{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px}
.W{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
.abs{position:absolute;left:0;top:0}
.glow{position:absolute;border-radius:50%;mix-blend-mode:screen;pointer-events:none}
/* verre dépoli (MO5) : un seul par groupe à l'écran ; ombre portée réduite (les grandes ombres floues coûtent cher) */
/* l'ombre interne floue du bas est peinte en dégradé (même aspect, sans flou à recalculer) */
.glass{position:absolute;border-radius:36px;background:linear-gradient(rgba(0,0,0,0) 64%,rgba(0,0,0,.16)),linear-gradient(140deg,rgba(255,255,255,.20),rgba(255,255,255,.05) 45%,rgba(255,255,255,.08));
  -webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border:1.5px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 24px 44px rgba(0,0,0,.45);overflow:hidden}
/* derrière la carte de devant : même aspect, fond opaque, aucun flou */
.glass.flat{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(rgba(0,0,0,0) 64%,rgba(0,0,0,.16)),linear-gradient(140deg,#39323a,#1e1920 45%,#262027)}
/* verre peint (aucun backdrop-filter) : cases, palettes */
.pcell,.pflap{position:absolute;left:0;top:0;border-radius:22px;background:linear-gradient(rgba(0,0,0,0) 62%,rgba(0,0,0,.2)),linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.04) 48%,rgba(255,255,255,.08));
  border:1.5px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.42)}
.pflap{border-radius:14px;display:flex;align-items:center;justify-content:center;font:700 64px Clash;transform-origin:50% 50%;backface-visibility:hidden}
.pflap i{position:absolute;left:0;right:0;top:50%;height:3px;background:rgba(0,0,0,.45)}
.ring{position:absolute;box-shadow:0 0 0 3px rgba(255,179,138,.95),0 0 40px rgba(255,110,40,.6);pointer-events:none}
.sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.2) 42%,transparent 54%);pointer-events:none}
.notif{width:780px;height:184px;display:flex;align-items:center;gap:26px;padding:22px 32px 22px 22px}
.notif canvas{width:186px;height:138px;border-radius:22px;flex:none;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.notif .app{font:500 22px Satoshi;color:rgba(246,239,231,.7);margin-bottom:6px;white-space:nowrap}
.notif .ti{font:700 34px Satoshi;white-space:nowrap}
.notif .am{font:700 54px Clash;font-variant-numeric:tabular-nums;white-space:nowrap}
.notif .am b{color:var(--o2)}
.ticket{height:auto;min-height:184px;padding-top:24px;padding-bottom:24px}
.ticket .tl{font:500 28px Satoshi;color:rgba(246,239,231,.88);white-space:nowrap;line-height:1.3}
.ticket .tl b{font-weight:700;color:#f6efe7}
.digit{position:absolute;left:0;top:0;overflow:hidden;border-radius:22px}
.digit .col{position:absolute;left:0}
.digit .col span{display:block;text-align:center;font-weight:700;font-family:Clash}
.digit::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,7,10,.7),transparent 26%,transparent 74%,rgba(8,7,10,.7))}
.stamp{position:absolute;padding:8px 22px 10px;border:4px solid var(--o2);border-radius:14px;font:700 34px Clash;color:var(--o3);letter-spacing:.04em;white-space:nowrap;
  box-shadow:0 0 22px rgba(255,110,40,.55),inset 0 0 14px rgba(255,110,40,.35);text-shadow:0 0 14px rgba(255,120,50,.6);background:rgba(8,7,10,.35);transform-origin:50% 50%}
.stamp.serif2{font:italic 500 46px Fraunces;padding:4px 24px 10px;letter-spacing:0}
/* étiquette en papier (MO5), suspendue au rétroviseur */
.ptag{position:absolute;border-radius:10px 18px 18px 10px;background:linear-gradient(#f6eee2,#e2d4bf);color:#1c140e;box-shadow:0 14px 24px rgba(0,0,0,.5),inset 0 -2px 0 rgba(0,0,0,.08)}
.ptag::before{content:"";position:absolute;left:50%;top:9px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#2a1f17;box-shadow:inset 0 2px 2px rgba(0,0,0,.6)}
.pt-top{position:absolute;left:22px;top:24px;font:700 22px Satoshi;letter-spacing:.2em;color:#4a3828;white-space:nowrap}
.pt-old{position:absolute;left:22px;top:46px;font:700 72px Clash;line-height:80px;white-space:nowrap;transform-origin:0 0}
.msg{position:absolute;padding:18px 30px;border-radius:34px 34px 34px 10px;white-space:nowrap;font:700 38px Satoshi}
.serif{font-family:Fraunces;font-style:italic;font-weight:500;background:linear-gradient(100deg,var(--o1),var(--o2) 55%,var(--o3));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .14em 0 .06em}
.trail{position:absolute;left:0;top:0;border-radius:6px;background:linear-gradient(90deg,rgba(255,230,210,.9),rgba(255,120,50,.5),transparent)}
.chip{position:absolute;left:0;top:0;font:700 56px Clash;white-space:nowrap;color:#ffd9c2;text-shadow:0 0 18px rgba(255,110,40,.85),0 0 4px rgba(255,200,170,.9)}
.card{position:absolute;left:110px;width:860px;border-radius:44px;padding:44px 50px 36px;background:linear-gradient(140deg,rgba(255,255,255,.15),rgba(255,255,255,.04) 45%,rgba(255,255,255,.07)),rgba(14,11,16,.58)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.085;mix-blend-mode:overlay}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(85% 65% at 50% 45%,transparent 50%,rgba(0,0,0,.72))}
</style>
</head>
<body>
<div id="stage"></div>
<script src="../lib/motion.js"></script>
<script src="../lib/kit47.js"></script>
<script src="kit-mo13.js"></script>
<script src="../assets/photos-mo13/car-206-mo13-contour.js"></script>
<script src="../assets/photos-mo13/car-megane2-contour.js"></script>
<script src="../assets/photos-mo13/car-fiesta6-contour.js"></script>
<script src="../assets/photos-mo13/car-206-mo13-reperes.js"></script>
<script src="../assets/photos-mo13/car-megane2-reperes.js"></script>
<script src="../assets/photos-mo13/car-fiesta6-reperes.js"></script>
<script src="film.js"></script>
</body>
</html>

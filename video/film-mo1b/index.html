<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>utopicar — MO1 v2 (voix de Simon, éléments graphiques)</title>
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;src:url(../assets/site/Archivo-latin.woff2) format('woff2');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#07182A}
:root{--or:#FF5A1F;--or2:#FF7A45;--pa:#F4F1EC;--ink:#FFFFFF;--mute:#8FA3B8;--red:#FF5C5C;--grn:#2FD597;--nav:#0A2238}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;color:#FFFFFF;
  background:radial-gradient(ellipse 70% 55% at 50% 45%,#020A15 0%,#051526 45%,#0A2238 100%)}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
.abs{position:absolute;left:0;top:0}
.crop{position:absolute}
/* textes */
.txt{position:absolute;left:140px;top:0;width:800px;text-align:center;white-space:nowrap;transform-origin:400px 50%}
.txt .ln{display:block}.txt .wd{display:inline-block;position:relative}.txt .ch{display:inline-block}
.ph{font-weight:700;font-size:74px;line-height:1.15;letter-spacing:-.015em}
.ph .o{color:var(--or2)}
.big{font-weight:800;font-size:190px;line-height:1;letter-spacing:-.035em}
.big .rd{color:var(--red)}.big .gr{color:var(--grn)}
.sub{font-weight:500;font-size:60px;color:var(--mute)}
.ital{font-style:italic;font-weight:500;color:#C9D3DE}
.whisper{font-weight:600;font-size:58px;letter-spacing:.12em;color:#DCE6F0}
/* cartes d'interface */
.card{position:absolute;left:0;top:0;background:#FFFFFF}
.hl{position:absolute;background:#FFC4A8;mix-blend-mode:multiply;border-radius:6px;transform-origin:0 50%}
/* éléments graphiques */
.pillg{position:absolute;left:0;top:0;display:flex;align-items:center;gap:14px;white-space:nowrap;padding:18px 30px;border-radius:60px;font-weight:700;font-size:44px;
  background:#12314A;color:#EAF2F9;box-shadow:0 20px 50px -18px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.08)}
.pillg i{font-style:normal;display:inline-flex;width:52px;height:52px;border-radius:26px;align-items:center;justify-content:center;background:var(--grn);color:#062417;font-weight:900;font-size:34px}
.pillg.or i{background:var(--or);color:#1A1310}
.chip{position:absolute;left:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:40px;width:640px;padding:24px 34px;border-radius:26px;background:#F4F1EC;color:#15110d;
  font-weight:700;font-size:40px;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.chip b{font-weight:800;color:#D93A2B}
.count{position:absolute;left:140px;top:0;width:800px;text-align:center;font-weight:800;font-size:170px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{display:block;font-size:44px;font-weight:600;letter-spacing:0;color:var(--mute);margin-top:6px}
.stamp{position:absolute;left:0;top:0;padding:10px 38px 6px;border:10px solid var(--red);border-radius:26px;color:var(--red);font-weight:900;font-size:120px;letter-spacing:.02em;white-space:nowrap;
  background:rgba(255,92,92,.08)}
.stamp.go{border-color:var(--grn);color:var(--grn);background:rgba(47,213,151,.08);font-size:80px;border-width:8px}
.toast{position:absolute;left:0;top:0;width:780px;display:flex;gap:26px;align-items:center;padding:26px 30px;border-radius:34px;background:rgba(244,241,236,.97);color:#15110d;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
.toast img{width:96px;height:96px;flex:none;border-radius:22px}
.toast .t1{font-weight:800;font-size:36px}.toast .t2{font-weight:500;font-size:32px;color:#5b534b;margin-top:4px}.toast .t2 b{color:#0E8F63;font-weight:800}
.lock{position:absolute;left:0;top:0;height:170px}
.kick{position:absolute;left:0;top:0;display:flex;align-items:center;gap:20px;white-space:nowrap;font-size:40px;font-weight:600;color:#DCE6F0}
.kick img{height:78px}
.cta{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;font-weight:800;font-size:68px;line-height:1.25;color:#FFFFFF}
.cta .g{display:inline-block;background:var(--or);color:#1A1310;border-radius:22px;padding:4px 26px 2px;margin:8px 0}
.cta2{position:absolute;left:140px;top:0;width:800px;text-align:center;font-weight:500;font-size:46px;line-height:1.3;color:#AEBBC8}
.demo{position:absolute;left:140px;top:1446px;width:800px;text-align:center;font-size:27px;font-weight:600;color:#5E7388}
.drop{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFD2BC 0%,#FF7A45 35%,#FF5A1F 70%);box-shadow:0 0 30px 10px rgba(255,90,31,.45)}
.ghost{position:absolute;left:0;top:0;border-radius:50%;background:#FF5A1F}
.flower{position:absolute;left:0;top:0;width:600px;height:600px}.flower svg{width:600px;height:600px;display:block}
.ripple{position:absolute;left:0;top:0;width:120px;height:120px;border-radius:50%;border:6px solid var(--or2)}
.cursor{z-index:50}
svg.g{position:absolute;left:0;top:0;overflow:visible}
.lbl{font-family:'Archivo',sans-serif;font-weight:700}
</style>
</head>
<body>
<div id="stage"></div>
<script src="../lib/motion.js"></script>
<script src="../lib/kit.js"></script>
<script type="module" src="film.js"></script>
</body>
</html>

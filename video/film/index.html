<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>UTOPICAR — film 9:16</title>
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:400 800;font-stretch:62% 125%;src:url(../assets/site/Archivo-latin.woff2) format('woff2');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0C0F14}
body{font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0C0F14}
/* éclairage doux derrière l'écran (profondeur), jamais derrière les titres */
#light{position:absolute;left:-200px;top:700px;width:1480px;height:1500px;background:radial-gradient(closest-side,rgba(60,72,96,.42),rgba(12,15,20,0))}
/* titres */
#titles{position:absolute;left:72px;top:176px;width:868px}
.title{position:absolute;left:0;top:0;width:100%}
.tl{overflow:hidden;padding:0 0 .14em;margin-bottom:-.14em;white-space:nowrap}
.tl span{display:inline-block;color:#FFFFFF;font-weight:800;font-stretch:125%;letter-spacing:-.03em;line-height:1.02;font-variant-numeric:tabular-nums}
.tl .key{color:#FFC928}
/* écran de l'app */
#device{position:absolute;overflow:hidden;background:#F2F4F7;border-radius:44px}
#cam{position:absolute;left:0;top:0;width:390px;height:567px;transform-origin:0 0}
.view{position:absolute;left:0;top:0;width:390px;height:567px;overflow:hidden;background:#F2F4F7}
.scroll{position:absolute;left:0;top:0;width:390px}
.scroll>img,.lay{position:absolute;display:block}
.glass{position:absolute}
.glass>.bd{position:absolute;inset:0}
.glass>img{position:absolute;left:0;top:0;width:100%;height:100%}
.counter{position:absolute;white-space:nowrap;font-family:'Archivo'}
#fill{position:absolute;inset:0;background:#FFC928}
#mark{position:absolute;left:50%;top:50%;color:#1A1400}
#mark svg{width:100%;height:100%;display:block}
#cursor{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(12,15,20,.62);box-shadow:0 0 0 4px #FFFFFF}
/* logo + CTA */
#word{position:absolute;color:#EDEFF3;font-weight:800;font-stretch:125%;letter-spacing:.02em;white-space:nowrap;line-height:1}
.cta{position:absolute;left:72px;overflow:hidden;padding-bottom:.12em;white-space:nowrap}
.cta span{display:inline-block;color:#FFFFFF;font-weight:800;font-stretch:125%;letter-spacing:-.03em;line-height:1.02}
#ctaPill{position:absolute;left:72px;background:#FFC928;color:#1A1400;border:3px solid #E5AE00;border-radius:28px;font-weight:800;font-stretch:125%;letter-spacing:.01em;line-height:1;white-space:nowrap;box-shadow:inset 0 -6px 0 rgba(0,0,0,.07)}
#ctaPost span{color:#C4CAD3;font-weight:600;font-stretch:100%;letter-spacing:-.01em}
</style>
</head>
<body>
<div id="stage">
  <div id="light"></div>
  <div id="titles"></div>
  <div id="device"><div id="cam"></div><div id="fill"></div><div id="mark"></div></div>
  <div id="cursor"></div>
  <div id="word"></div>
  <div class="cta" id="ctaPre"><span></span></div>
  <div id="ctaPill"></div>
  <div class="cta" id="ctaPost"><span></span></div>
</div>
<script src="../lib/motion.js"></script>
<script src="film.js"></script>
</body>
</html>

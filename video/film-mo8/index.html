<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MO8 · Les 5 moteurs</title>
<style>
@font-face{font-family:Clash;src:url(../assets/fonts-site/ClashDisplay-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:Clash;src:url(../assets/fonts-site/ClashDisplay-600.woff2) format("woff2");font-weight:600}
@font-face{font-family:Satoshi;src:url(../assets/fonts-site/Satoshi-500.woff2) format("woff2");font-weight:500}
@font-face{font-family:Satoshi;src:url(../assets/fonts-site/Satoshi-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:Fraunces;src:url(../assets/fonts-mo5/Fraunces.woff2) format("woff2");font-style:italic}
:root{--bg0:#08070a;--o1:#ff5a1f;--o2:#ff8a4c;--o3:#ffb38a;--ink:#f6efe7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg0)}
#stage{position:absolute;inset:0;overflow:hidden;font-family:Satoshi;color:var(--ink);-webkit-font-smoothing:antialiased}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px}
.L{position:absolute;left:0;top:0;width:1080px;height:1920px}
.abs{position:absolute;left:0;top:0}
.cone{position:absolute;left:540px;top:-200px;width:1500px;height:1500px;margin-left:-750px;background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(255,138,76,.08) 175deg,rgba(255,179,138,.12) 180deg,rgba(255,138,76,.08) 185deg,transparent 200deg);filter:blur(30px);mix-blend-mode:screen;pointer-events:none}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='7'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(85% 65% at 50% 45%,transparent 50%,rgba(0,0,0,.7))}
.glow{position:absolute;border-radius:50%;filter:blur(60px);mix-blend-mode:screen;pointer-events:none}
.n{font-family:Clash;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ext{text-shadow:0 1px 0 #d8cfc6,0 2px 0 #bfb5ab,0 3px 0 #a79c92,0 4px 0 #8f8479,0 5px 0 #786d63,0 6px 0 #61574e,0 16px 30px rgba(0,0,0,.6)}
.serif{font-family:Fraunces;font-style:italic;font-weight:500;background:linear-gradient(100deg,var(--o1),var(--o2) 55%,var(--o3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,100,40,.55))}
.lit{filter:drop-shadow(0 0 26px rgba(255,120,50,.35)) drop-shadow(0 0 2px rgba(255,200,170,.6))}
.glass{position:absolute;border-radius:36px;background:linear-gradient(140deg,rgba(255,255,255,.20),rgba(255,255,255,.05) 45%,rgba(255,255,255,.08));-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border:1.5px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -20px 40px rgba(0,0,0,.18),0 40px 80px rgba(0,0,0,.55);overflow:hidden}
.sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 42%,transparent 52%);pointer-events:none}
/* palette du compte à rebours : quatre demi-plaques (haut fixe, bas fixe, volet avant, volet arrière) */
.flapbox{position:absolute;left:442px;top:236px;width:196px;height:236px;perspective:900px}
.half{position:absolute;left:0;width:196px;height:118px;overflow:hidden;background:linear-gradient(140deg,rgba(255,255,255,.18),rgba(255,255,255,.05) 60%);border:1.5px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);backface-visibility:hidden}
.half.top{top:0;border-radius:26px 26px 0 0;border-bottom:none;transform-origin:50% 100%}
.half.bot{top:118px;border-radius:0 0 26px 26px;border-top:none;transform-origin:50% 0}
.half span{position:absolute;left:0;width:196px;height:236px;display:flex;align-items:center;justify-content:center;font:700 196px/1 Clash;color:var(--ink);padding-top:16px}
.half.bot span{top:-118px}
.half.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.55)}
.no{position:absolute;left:286px;top:322px;font:700 30px Satoshi;letter-spacing:6px;color:rgba(246,239,231,.55)}
/* bandeau photo (voiture + nom) */
.strip{position:absolute;left:110px;width:860px;border-radius:28px;overflow:hidden;border:1.5px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 30px 60px rgba(0,0,0,.55)}
.strip::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,7,10,.85) 0%,rgba(8,7,10,.35) 42%,rgba(8,7,10,0) 55%),linear-gradient(115deg,transparent 40%,rgba(255,255,255,.10) 50%,transparent 60%)}
.strip.rev::after{background:linear-gradient(270deg,rgba(8,7,10,.92) 0%,rgba(8,7,10,.4) 22%,rgba(8,7,10,0) 40%),linear-gradient(115deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%)}
.strip .t{position:absolute;left:40px;top:50%;transform:translateY(-50%);z-index:1;white-space:nowrap}
.strip .t .m{font:700 64px/1 Clash}.strip .t .e{margin-top:12px;font:700 24px Satoshi;letter-spacing:3px;color:rgba(246,239,231,.65)}
.strip .num{position:absolute;right:40px;top:50%;transform:translateY(-50%);z-index:1;font:700 64px/1 Clash;color:rgba(246,239,231,.9)}
.sweep{position:absolute;top:0;bottom:0;width:120px;margin-left:-60px;background:linear-gradient(90deg,rgba(255,90,31,0),rgba(255,140,70,.35) 35%,rgba(255,240,225,.95) 50%,rgba(255,140,70,.35) 65%,rgba(255,90,31,0));mix-blend-mode:screen;z-index:2}
/* coût */
.cost{position:absolute;left:540px;top:1308px;display:flex;align-items:baseline;gap:20px;white-space:nowrap}
.cost .j{font:500 36px Satoshi;color:rgba(246,239,231,.7)}
.roll{display:flex;align-items:baseline;font:700 110px/1 Clash;letter-spacing:-.02em}
.roll .d{position:relative;display:inline-block;height:110px;overflow:hidden}
.roll .d .col{position:absolute;left:0;top:0;display:flex;flex-direction:column}
.roll .d .col span{height:110px;line-height:110px;display:block}
.roll .d .ghost{visibility:hidden}
.mention{position:absolute;left:540px;top:1446px;transform:translateX(-50%);font:500 22px Satoshi;color:rgba(246,239,231,.5);white-space:nowrap}
/* étiquettes reliées aux pièces */
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(#fff,#ffb38a 40%,rgba(255,90,31,0) 70%);box-shadow:0 0 24px 8px rgba(255,110,40,.55)}
.pill{position:absolute;padding:14px 28px 16px 26px;border-radius:999px;white-space:nowrap;display:flex;align-items:baseline;gap:14px}
.pill .k{font:700 32px Satoshi;color:rgba(246,239,231,.92)}
.pill .v{font-size:46px;line-height:1}
.car{position:absolute;left:0;top:0;transform-origin:0 0}
.wisp{position:absolute;width:160px;height:220px;margin:-110px 0 0 -80px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,240,230,.5),rgba(255,240,230,0));filter:blur(14px)}
</style>

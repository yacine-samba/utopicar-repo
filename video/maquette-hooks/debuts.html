<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Débuts de vidéos · concept « 4 réponses »</title>
<style>
@font-face{font-family:Clash;font-weight:600;src:url(../assets/fonts-site/ClashDisplay-600.woff2) format('woff2')}
@font-face{font-family:Satoshi;font-weight:500;src:url(../assets/fonts-site/Satoshi-500.woff2) format('woff2')}
@font-face{font-family:Satoshi;font-weight:700;src:url(../assets/fonts-site/Satoshi-700.woff2) format('woff2')}
:root{--o:#ff5a1f;--ink:#1c1612}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#141110}
.f{position:absolute;inset:0;overflow:hidden;font-family:Satoshi;color:#fff;-webkit-font-smoothing:antialiased}
.photo{position:absolute;left:0;top:0;width:1080px;background-size:cover;transform-origin:50% 40%}
.fade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0) 20%,rgba(0,0,0,0) 44%,#141110 64%)}
.kick{position:absolute;left:110px;top:226px;width:800px;padding:22px 30px 26px;border-radius:30px;background:rgba(20,17,16,.72);font:600 74px/1.04 Clash;letter-spacing:-.02em;color:#fff}.kick em{font-style:normal;color:var(--o)}.kick small{display:inline-block;font:700 30px Satoshi;letter-spacing:.12em;color:#1a1310;background:var(--o);border-radius:10px;padding:4px 12px;margin-bottom:12px}
.ann{position:absolute;left:140px;top:820px;width:800px;box-sizing:border-box;padding:26px 34px;border-radius:32px;background:#fff;color:var(--ink);box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.ann .m{font:600 40px Clash;letter-spacing:-.01em}
.ann .s{font:500 28px Satoshi;opacity:.6;margin-top:4px}
.ann .p{position:relative;display:inline-block;font:600 104px/1 Clash;margin-top:14px;letter-spacing:-.03em}
.ann .p i{position:absolute;left:-8px;bottom:6px;height:30px;border-radius:8px;background:rgba(255,90,31,.6);z-index:-1}
.q{position:absolute;left:140px;top:1085px;width:800px;text-shadow:0 4px 18px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6);font:600 64px/1.12 Clash;letter-spacing:-.03em}
.q b{color:var(--o);font-weight:600;font-size:1.5em;letter-spacing:-.03em}.q b.r{color:#ff4d4d}.q b.g{color:#3ccf7a}
.chk{position:absolute;left:140px;top:1305px;display:flex;gap:12px;flex-wrap:wrap;width:800px}
.chk span{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.1);font:700 28px Satoshi}
.chk span i{width:22px;height:22px;border-radius:6px;border:3px solid rgba(255,255,255,.7)}

.bf{position:absolute;left:140px;top:960px;width:800px;box-sizing:border-box;border-radius:34px;background:#fff;color:var(--ink);padding:22px 30px 26px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
.bf .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bf .lg{font:600 46px Clash;letter-spacing:-.02em}.bf .lg i{font-style:normal;color:var(--o)}
.bf .tm{font:700 24px Satoshi;color:#fff;background:var(--ink);border-radius:999px;padding:8px 16px}
.bf .r{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:2px dashed rgba(28,22,18,.12);font:500 32px Satoshi;color:rgba(28,22,18,.7)}
.bf .r b{font:600 40px Clash;color:var(--ink)}.bf .r b.ok{color:#137036}.bf .r b.ko{color:#c81e1e}
.bf .pm{margin-top:10px;padding:14px 20px;border-radius:20px;background:#fff1ea;display:flex;justify-content:space-between;align-items:baseline;font:700 30px Satoshi;color:var(--ink)}.bf .pm b{font:600 62px/1 Clash;color:var(--o)}
</style></head><body>
<div id="f" class="f"></div>
<script>
// Photos Pexels (logos, noms et plaques floutés). Modèle, année, km et prix : relevés réels de la base du marché UTOPICAR (3 au 9 oct. 2026).
const V = [
  // vraies annonces sous le marché (base du marché UTOPICAR, oct. 2026) ; revente normale = médiane des comparables × 0,95 (calcul de l'outil) ;
  // bénéfice = revente − prix − carte grise (4 CV, demi-tarif) − 20 € de frais fixes, avant réparations et trajet ; prix max = revente − frais − 750 €
  { fi: 1, vf: 'boîte DSG', rev: '6 150 €', ben: '+978 €', pm: '5 228 €', img: 'polo5.jpg', h: 1240, pos: '32% 60%', m: 'Volkswagen Polo 5 TDI', s: '2014 · 177 000 km · Diesel', p: '5 000 €', b: '5 500 €', t1: 'Revendue en 1 à 2 mois :', t2: '<b class="g">+978 €</b> de bénef' },
  { fi: 1, vf: 'injecteurs dCi', rev: '5 100 €', ben: '+938 €', pm: '4 178 €', img: 'clio3.jpg', h: 1240, pos: '42% 55%', m: 'Renault Clio 3 dCi 75', s: '2012 · 173 000 km · Diesel', p: '3 990 €', b: '4 500 €', t1: 'Revendue en 1 à 2 mois :', t2: '<b class="g">+938 €</b> de bénef' },
  { fi: 1, vf: 'boîte Quickshift', rev: '4 000 €', ben: '+828 €', pm: '3 078 €', img: 'twingo.jpg', h: 1240, pos: '67% 40%', m: 'Renault Twingo 2 1.2 75 ch', s: '2011 · 120 000 km · Essence', p: '3 000 €', b: '3 500 €', t1: 'Revendue en 1 à 2 mois :', t2: '<b class="g">+828 €</b> de bénef' },
];
const Q = new URLSearchParams(location.search), [vs, ts] = (Q.get('s') || '1_0').split('_'), v = V[(+vs || 1) - 1], t = +(ts || 0);   // ?s=<vidéo>_<seconde>
const E = (a, d) => { const p = Math.min(1, Math.max(0, (t - a) / d)); return 1 - Math.pow(1 - p, 3); };
const f = document.getElementById('f');
const pIn = E(0.1, 0.5), qIn = E(0.55, 0.3), cIn = 0, bIn = E(2.6, 0.4);   // le bénéfice tombe dès la 1re seconde   // à 2,6 s : l'analyse Benef remplace la checklist
f.innerHTML = `
  <div class="photo" style="height:${v.h}px;background-image:url(../assets/hooks-photos/${v.img});background-position:${v.pos};transform:scale(${(1.08 - 0.025 * t).toFixed(4)})"></div>
  <div class="fade"></div>
  <div class="kick"><small>POV</small><br>Ta 1<sup style="font-size:.5em">re</sup> revente,<br>budget <em>${v.b}</em></div>
  <div class="ann" style="transform:translateY(${(1250 * (1 - pIn) - 330 * bIn).toFixed(0)}px) rotate(${(-4 * (1 - pIn)).toFixed(2)}deg) scale(${(1 - 0.12 * bIn).toFixed(3)});transform-origin:0 0">
    <div class="m">${v.m}</div><div class="s">${v.s}</div><div class="p">${v.p}<i style="width:${(100 * E(0.8, 0.5)).toFixed(0)}%"></i></div></div>
  <div class="q" style="opacity:${qIn.toFixed(2)};transform:translateY(${(40 * (1 - qIn) - 360 * bIn).toFixed(0)}px)">${v.t1}<br><span style="opacity:${E(0.8, 0.25).toFixed(2)};display:inline-block;transform:scale(${(1 + 0.25 * (1 - E(0.8, 0.35))).toFixed(3)});transform-origin:0 60%">${v.t2}</span></div>
  <div class="bf" style="opacity:${Math.min(1, bIn * 3).toFixed(2)};transform:translateY(${(700 * (1 - bIn)).toFixed(0)}px)"><div class="hd"><span class="lg">Analyse <i>UTOPICAR</i></span><span class="tm">⏱ 1 min</span></div><div class="r">Moteur fiable ?<b class="${v.fi ? 'ok' : 'ko'}">${v.fi ? 'Oui' : 'À fuir'}</b></div><div class="r">À vérifier<b>${v.vf}</b></div><div class="r">Revente (1 à 2 mois)<b>${v.rev}</b></div><div class="r">Bénéfice<b class="ok">${v.ben}</b></div><div class="pm">Ton prix max<b>${v.pm}</b></div></div><div class="chk" style="opacity:${cIn.toFixed(2)};transform:translateY(${(30 * (1 - cIn)).toFixed(0)}px)">${['Revente', 'Frais', 'Bénef', 'Prix max'].map((x) => `<span><i></i>${x}</span>`).join('')}</div>`;
const pre = new Image(); pre.src = `../assets/hooks-photos/${v.img}`;
document.fonts.ready.then(() => pre.decode().catch(() => {})).then(() => setTimeout(() => (window.ready = true), 300));
</script></body></html>

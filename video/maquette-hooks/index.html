<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Premières images · concept « 4 réponses »</title>
<style>
@font-face{font-family:Clash;font-weight:600;src:url(../assets/fonts-site/ClashDisplay-600.woff2) format('woff2')}
@font-face{font-family:Clash;font-weight:700;src:url(../assets/fonts-site/ClashDisplay-700.woff2) format('woff2')}
@font-face{font-family:Satoshi;font-weight:500;src:url(../assets/fonts-site/Satoshi-500.woff2) format('woff2')}
@font-face{font-family:Satoshi;font-weight:700;src:url(../assets/fonts-site/Satoshi-700.woff2) format('woff2')}
@font-face{font-family:Instrument;font-style:italic;src:url(../assets/fonts-site/InstrumentSerif-Italic.woff2) format('woff2')}
:root{--o:#ff5a1f;--ink:#1c1612;--w:#fbf9f5;--ok:#137036;--r:#c81e1e}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#141110}
.f{position:absolute;inset:0;overflow:hidden;font-family:Satoshi;color:#fff;-webkit-font-smoothing:antialiased}
.photo{position:absolute;left:0;top:0;width:1080px;height:1240px;background-size:cover}
.fade{position:absolute;left:0;top:0;width:1080px;height:1920px;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 46%,#141110 66%)}
.kick{position:absolute;left:140px;top:240px;padding:14px 26px;border-radius:999px;background:var(--o);color:#1a1310;font:700 34px Satoshi;letter-spacing:.04em}
.ann{position:absolute;left:140px;top:790px;width:800px;box-sizing:border-box;padding:26px 34px;border-radius:32px;background:#fff;color:var(--ink);box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.ann .m{font:600 40px Clash;letter-spacing:-.01em}
.ann .s{font:500 28px Satoshi;opacity:.6;margin-top:4px}
.ann .p{position:relative;display:inline-block;font:600 104px/1 Clash;margin-top:14px;letter-spacing:-.03em}
.ann .p i{position:absolute;left:-8px;right:-8px;bottom:6px;height:30px;border-radius:8px;background:rgba(255,90,31,.6);z-index:-1}
.ann .ex{position:absolute;right:28px;top:26px;font:700 20px Satoshi;letter-spacing:.12em;color:rgba(28,22,18,.4)}
.q{position:absolute;left:140px;top:1215px;width:800px;font:600 92px/1.02 Clash;letter-spacing:-.03em}
.q b{color:var(--o);font-weight:600}
.chk{position:absolute;left:140px;top:1335px;display:flex;gap:12px;flex-wrap:wrap;width:800px}
.chk span{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.1);font:700 28px Satoshi}
.chk span i{width:22px;height:22px;border-radius:6px;border:3px solid rgba(255,255,255,.7)}
.tabs{position:absolute;left:110px;top:330px;width:860px}
.tab{position:absolute;padding:20px 26px;border-radius:18px;background:#fff;color:var(--ink);font:600 32px Satoshi;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);white-space:nowrap;display:flex;gap:14px;align-items:center}
.tab u{text-decoration:none;font:700 22px Satoshi;color:#fff;background:#8a8f99;border-radius:8px;padding:4px 10px}
.clock{position:absolute;right:140px;top:1110px;font:600 120px/1 Clash;color:#fff;letter-spacing:-.03em}
.clock small{display:block;font:700 26px Satoshi;letter-spacing:.14em;color:rgba(255,255,255,.6);text-align:right;margin-bottom:6px}
.seul{position:absolute;left:140px;top:1280px;width:800px;font:400 84px/1 Instrument;font-style:italic;color:#fff}
.cred{position:absolute;left:140px;top:1405px;font:500 18px Satoshi;color:rgba(255,255,255,.45)}
</style></head><body>
<div id="f" class="f"></div>
<script>
const A = {
  // photos Pexels (logos, noms de modèle et plaques floutés) ; prix, année et km : relevés de la base du marché UTOPICAR (10 oct. 2026)
  polo: { img: '../assets/hooks-photos/polo5.jpg', pos: '30% 60%', m: 'Volkswagen Polo 1.4 TDI', s: '2014 · 154 272 km · Diesel', p: '7 500 €' },
  p208: { img: '../assets/hooks-photos/p208.jpg', pos: '50% 72%', m: 'Peugeot 208', s: '2015 · 115 000 km · Diesel', p: '10 990 €' },
  golf: { img: '../assets/hooks-photos/golf7.jpg', pos: '62% 50%', m: 'Volkswagen Golf 7', s: '2013 · 176 000 km · Essence', p: '12 400 €' },
  classeA: { img: '../assets/hooks-photos/classea.jpg', pos: '48% 60%', m: 'Mercedes Classe A', s: '2018 · 92 100 km · Diesel', p: '21 390 €' },
};
const s = +(new URLSearchParams(location.search).get('s') || 1);
const k = ['polo', 'p208', 'golf', 'classeA', 'polo'][s - 1], a = A[k], f = document.getElementById('f');
const ann = `<div class="ann"><div class="m">${a.m}</div><div class="s">${a.s}</div><div class="p">${a.p}<i></i></div></div>`;
f.innerHTML = `<div class="photo" style="background-image:url(${a.img});background-position:${a.pos}"></div><div class="fade"></div><div class="kick">ACHAT-REVENTE · DÉBUTANT</div>` + ann;
if (s <= 4) {
  f.innerHTML += `<div class="q">Fiable ? Revente ?<br><b>Ton bénef ?</b></div>`;
  f.querySelector('.q').style.top = '1090px';
  f.innerHTML += `<div class="chk" style="top:1305px">${['Fiable', 'À vérifier', 'Revente', 'Bénef'].map((x) => `<span><i></i>${x}</span>`).join('')}</div>`;
} else {
  // B : la galère, juste après les 3 premières secondes
  const T = [['Forum', 'fiabilité Polo 1.4 TDI ?', 0, 0, -4], ['Annonces', 'Polo 2014 diesel 150 000 km', 70, 120, 3], ['Cote', 'prix Polo 1.4 TDI 2014', 20, 240, -2], ['Calcul', 'carte grise + trajet + travaux', 110, 360, 4], ['Forum', 'Polo TDI embrayage à vérifier ?', 40, 480, -3]];
  f.innerHTML += `<div class="tabs">${T.map(([t, l, x, y, r]) => `<div class="tab" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)"><u>${t}</u>${l}</div>`).join('')}</div>`;
  f.querySelector('.ann').style.cssText += ';top:900px;transform:scale(.82);transform-origin:0 0;opacity:.6';
  f.innerHTML += `<div class="clock"><small>TEMPS PASSÉ</small>1 h 40</div><div class="seul">Seul, tu y passes ta soirée…</div>`;
}
const pre = new Image(); pre.src = a.img;
document.fonts.ready.then(() => pre.decode().catch(() => {})).then(() => setTimeout(() => (window.ready = true), 400));
</script></body></html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MO12 · La pochette</title>
<style>
@font-face{font-family:Clash;font-weight:700;src:url(../assets/fonts-site/ClashDisplay-700.woff2) format('woff2')}
@font-face{font-family:Clash;font-weight:600;src:url(../assets/fonts-site/ClashDisplay-600.woff2) format('woff2')}
@font-face{font-family:Satoshi;font-weight:500;src:url(../assets/fonts-site/Satoshi-500.woff2) format('woff2')}
@font-face{font-family:Satoshi;font-weight:700;src:url(../assets/fonts-site/Satoshi-700.woff2) format('woff2')}
@font-face{font-family:Fraunces;font-style:italic;src:url(../assets/fonts-mo5/Fraunces.woff2) format('woff2')}
:root{--bg0:#08070a;--o1:#ff5a1f;--o2:#ff8a4c;--o3:#ffb38a;--ink:#f6efe7;--mute:#a59a90}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg0)}
#stage{position:absolute;inset:0;overflow:hidden;color:var(--ink);font-family:Satoshi;-webkit-font-smoothing:antialiased;background:var(--bg0)}
.L{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px}
.abs{position:absolute;left:0;top:0}
.glow{position:absolute;border-radius:50%;mix-blend-mode:screen;pointer-events:none}
/* verre (MO5) */
.glass{position:absolute;border-radius:36px;background:linear-gradient(140deg,rgba(255,255,255,.20),rgba(255,255,255,.05) 45%,rgba(255,255,255,.08));
  -webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border:1.5px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -20px 40px rgba(0,0,0,.18),0 40px 80px rgba(0,0,0,.5);overflow:hidden}
.sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.2) 42%,transparent 54%);pointer-events:none}
.notif{width:780px;height:184px;display:flex;align-items:center;gap:26px;padding:22px 32px 22px 22px}
.notif canvas{width:186px;height:138px;border-radius:22px;flex:none;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.notif .app{font:500 24px Satoshi;color:rgba(246,239,231,.72);margin-bottom:6px;white-space:nowrap}
.notif .ti{font:700 36px Satoshi;white-space:nowrap}
.notif .am{font:700 58px Clash;font-variant-numeric:tabular-nums;white-space:nowrap}
.notif .am b{color:var(--o2)}
.digit{position:absolute;left:0;top:0;width:124px;height:172px;overflow:hidden;border-radius:24px}
.digit .col{position:absolute;left:0;width:124px}
.digit .col span{display:block;height:172px;line-height:172px;text-align:center;font:700 128px Clash}
.digit::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,7,10,.7),transparent 26%,transparent 74%,rgba(8,7,10,.7))}
.flapT{position:absolute;width:132px;height:180px;border-radius:20px;display:flex;align-items:center;justify-content:center;font:700 128px Clash;transform-origin:50% 50%;backface-visibility:hidden}
.flapT i{position:absolute;left:0;right:0;top:50%;height:3px;background:rgba(0,0,0,.5)}
.stamp{position:absolute;padding:8px 22px 10px;border:4px solid var(--o2);border-radius:14px;font:700 34px Clash;color:var(--o3);letter-spacing:.04em;white-space:nowrap;
  box-shadow:0 0 22px rgba(255,110,40,.55),inset 0 0 14px rgba(255,110,40,.35);text-shadow:0 0 14px rgba(255,120,50,.6);background:rgba(8,7,10,.35);transform-origin:50% 50%}
.sweep{position:absolute;width:90px;margin-left:-45px;background:linear-gradient(90deg,rgba(255,90,31,0),rgba(255,120,50,.25) 30%,rgba(255,236,220,.95) 48%,#fff 50%,rgba(255,236,220,.95) 52%,rgba(255,120,50,.25) 70%,rgba(255,90,31,0));
  -webkit-mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent);mix-blend-mode:screen;filter:blur(1px)}
.serif{font-family:Fraunces;font-style:italic;font-weight:500;background:linear-gradient(100deg,var(--o1),var(--o2) 55%,var(--o3));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .14em 0 .06em}
/* nouveau dans MO12 : horloge (film-mo12/clock.js) */
.ck-cell{position:absolute;left:0;top:0;transform-origin:50% 50%;backface-visibility:hidden}
.ck-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#f6efe7 45%,#d9cfc5);box-shadow:0 0 14px rgba(255,170,120,.35)}
.lab{position:absolute;left:0;width:1080px;text-align:center;font:700 40px Satoshi;letter-spacing:.3em;padding-left:.3em;color:rgba(246,239,231,.85);white-space:nowrap}
.lab .w{display:inline-block}
.lab sup{font-size:25px;letter-spacing:.06em;vertical-align:0;position:relative;top:-14px;margin-right:.18em}
/* cartes de document, badge, pochette (lib/kit47-pochette.js) */
.kp-doc{position:absolute;left:0;top:0;transform-origin:50% 50%}
.kp-doc .kp-bg{inset:0;border-radius:30px}
.kp-badge{position:absolute;left:0;top:0;transform-origin:0 0}
.kp-badge svg{position:absolute;left:0;top:0;overflow:visible}
.kp-num{position:absolute;left:0;top:22px;width:100%;text-align:center;font:700 46px Clash;line-height:46px;font-variant-numeric:tabular-nums}
.kp-unit{position:absolute;left:0;top:66px;width:100%;text-align:center;font:700 26px Satoshi;line-height:26px;color:rgba(246,239,231,.75);letter-spacing:.04em}
.kp-dur{position:absolute;left:0;top:0;font:700 38px Clash;line-height:38px;color:var(--o3);white-space:nowrap;transform-origin:0 50%}
.kp-name{position:absolute;left:0;top:0;font:700 48px Satoshi;line-height:48px;white-space:nowrap;transform-origin:0 0}
.kp-value{position:absolute;left:0;top:0;font:700 64px Clash;line-height:64px;white-space:nowrap;transform-origin:0 0;font-variant-numeric:tabular-nums}
.kp-value b{color:var(--o3);font-weight:700}
.kp-sp{display:inline-block;width:.26em}
.kp-sub{position:absolute;left:0;top:0;font:500 26px Satoshi;line-height:26px;color:rgba(246,239,231,.7);white-space:nowrap}
.kp-thumb{position:absolute;left:0;top:0;border-radius:18px;transform-origin:0 0;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.kp-fx{position:absolute;left:0;top:0;overflow:visible;transform-origin:0 0}
.kp-back{left:0;top:0;border-radius:30px;background:linear-gradient(160deg,rgba(40,30,34,.72),rgba(24,18,22,.66) 50%,rgba(36,26,28,.7));-webkit-backdrop-filter:none;backdrop-filter:none}
.kp-front .sheen{opacity:.4}
.kp-front{position:absolute;left:0;top:0;border-radius:30px;overflow:hidden;background:linear-gradient(172deg,rgba(255,236,220,.13),rgba(255,255,255,.035) 34%,rgba(255,255,255,.02) 70%,rgba(255,200,170,.08));
  border:1.5px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -24px 40px rgba(0,0,0,.12)}
.kp-lip{position:absolute;left:0;top:0;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(255,90,31,0),#ff8a4c 12%,#ffc3a0 50%,#ff8a4c 88%,rgba(255,90,31,0));box-shadow:0 0 16px rgba(255,110,40,.7)}
.kp-flap{left:0;top:0;border-radius:8px 8px 34px 34px;backface-visibility:visible}
.kp-flap .kp-lip{left:30px;right:30px;width:auto}
.kp-stamp{font-size:40px;padding:6px 26px 8px}
/* bulles, étiquette, tasse */
.bub{position:absolute;left:0;top:0;border-radius:34px 34px 34px 10px;transform-origin:0 100%}
.bub .n{position:absolute;left:30px;top:10px;font:500 30px Satoshi;line-height:34px;color:rgba(246,239,231,.78);white-space:nowrap}
.bub .t{position:absolute;left:30px;top:50px;font:700 40px Satoshi;line-height:40px;white-space:nowrap}
.ripple{position:absolute;left:0;top:0;border-radius:34px 34px 34px 10px;border:3px solid rgba(255,179,138,.9);box-shadow:0 0 26px rgba(255,110,40,.55);transform-origin:50% 50%}
.etiq{position:absolute;left:0;top:0;width:340px;height:160px;border-radius:12px;background:linear-gradient(#f6eee2,#e4d7c4);color:#1c140e;transform-origin:0 0;
  box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.08);font:700 72px Clash;line-height:160px;text-align:center;white-space:nowrap;letter-spacing:-.01em}
.etiq .stamp{left:50%;top:50%;font-size:92px;padding:0 26px 6px;border-width:8px;border-radius:18px;color:#ff6a2a;border-color:#ff6a2a;background:rgba(255,240,228,.92);
  text-shadow:none;box-shadow:0 0 0 2px rgba(255,106,42,.25)}
.big20{font:700 280px Clash;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#f6efe7;white-space:nowrap;
  text-shadow:0 1px 0 #d8cfc6,0 2px 0 #bfb5ab,0 3px 0 #a79c92,0 4px 0 #8f8479,0 5px 0 #786d63,0 6px 0 #61574e,0 16px 30px rgba(0,0,0,.6)}
.big20 span{font-size:130px;margin-left:26px;display:inline-block}
.tot{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
.tot .a{font:700 46px Satoshi;display:inline-block}
.tot .b{font:700 74px Clash;display:inline-block;margin-left:18px;background:linear-gradient(100deg,var(--o2),var(--o3));-webkit-background-clip:text;background-clip:text;color:transparent}
.xl{position:absolute;left:0;top:0;font:700 44px Satoshi;line-height:44px;white-space:nowrap}
.pill{position:absolute;padding:8px 20px;border-radius:999px;white-space:nowrap;font:700 30px Satoshi;background:rgba(8,7,10,.55);border:1.5px solid rgba(255,255,255,.25)}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.085;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='9'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(85% 65% at 50% 45%,transparent 50%,rgba(0,0,0,.72))}
</style>
</head>
<body>
<div id="stage"></div>
<script src="../lib/motion.js"></script>
<script src="../lib/kit47.js"></script>
<script src="../lib/kit47-pochette.js"></script>
<script src="clock.js"></script>
<script src="../assets/photos-mo12/car-c3-contour.js"></script>
<script src="../assets/photos-mo12/car-c3-reperes.js"></script>
<script src="film.js"></script>
</body>
</html>

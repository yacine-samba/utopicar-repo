<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>UTOPICAR — film produit 30 s</title>
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;src:url(../assets/site/Archivo-latin.woff2) format('woff2');}
@font-face{font-family:'Archivo';font-style:italic;font-weight:100 900;font-stretch:62% 125%;src:url(../assets/site/Archivo-italic-latin.woff2) format('woff2');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#FFFFFF}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#FFFFFF;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;color:#141413}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px}
/* lueur */
.orb{position:absolute;left:540px;top:960px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 42% 38%,#FFFBEA 0%,#FFE48A 30%,#FFC928 58%,rgba(255,201,40,0) 72%)}
.orbHalo{position:absolute;left:540px;top:960px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,40,.35) 0%,rgba(255,201,40,.12) 40%,rgba(255,201,40,0) 70%)}
/* mosaïque */
#mosaic{background:#FFC928}
#mosaic .sq{position:absolute;width:120px;height:120px;background:#FFE08A}
#mosaic .grid{position:absolute;left:0;top:0;width:1080px;height:1920px;background-image:linear-gradient(rgba(26,20,0,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(26,20,0,.06) 2px,transparent 2px);background-size:120px 120px}
.tile{position:absolute;display:grid;place-items:center;background:#FFFFFF}
.tile svg{display:block}
/* volets */
.wipe{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#FFC928}
/* mot-symbole tracé */
#draw{background:#FAF9F5}
#draw svg{position:absolute;left:0;top:0}
/* titres */
.head{position:absolute;left:0;width:1080px;text-align:center;font-weight:800;font-size:124px;letter-spacing:-.03em;line-height:1.06}
.head .ln{display:block;overflow:hidden;padding-bottom:.08em}
.head .ln>span{display:inline-block;position:relative}
.head .key{font-style:italic;padding:0 .06em}
.head .mark{position:absolute;left:-.04em;right:-.04em;bottom:.08em;height:.42em;background:#FFC928;transform-origin:0 50%;z-index:-1}
/* fin */
#endL{background:#FFFFFF}
.lockup{position:absolute;left:0;width:1080px;display:flex;align-items:center;justify-content:center;gap:34px}
.lockup .mk{width:150px;height:150px;border-radius:42px;background:#FFC928;display:grid;place-items:center;box-shadow:inset 0 -7px 0 rgba(0,0,0,.08)}
.lockup .mk svg{width:90px;height:90px}
.lockup .wd{font-weight:800;font-stretch:125%;letter-spacing:.02em;font-size:96px;line-height:1;white-space:nowrap;color:#141413}
.cta{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
.cta .ln{display:block;overflow:hidden;padding-bottom:.1em}
.cta .ln>span{display:inline-block}
#ctaPill{display:inline-block;background:#FFC928;border:3px solid #E5AE00;border-radius:26px;padding:14px 32px 12px;font-weight:800;font-stretch:125%;letter-spacing:.02em;box-shadow:inset 0 -5px 0 rgba(0,0,0,.07)}
</style>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/","opentype":"../node_modules/opentype.js/dist/opentype.module.js"}}</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div class="layer" id="orbL"><div class="orbHalo" id="halo"></div><div class="orb" id="orb"></div></div>
  <div class="layer" id="mosaic"><div class="grid"></div><div class="tile" id="tile"></div></div>
  <div class="layer" id="draw"></div>
  <div class="layer" id="heads"></div>
  <div class="layer" id="endL">
    <div class="lockup" id="lock"><div class="mk"></div><div class="wd">UTOPICAR</div></div>
    <div class="cta" id="cta" style="top:1080px;font-size:64px"></div>
  </div>
  <div class="layer" id="wipes"></div>
</div>
<script src="../lib/motion.js"></script>
<script type="module" src="film.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MO9 · 974 €</title>
<style>
@font-face{font-family:Clash;font-weight:700;src:url(../assets/fonts-site/ClashDisplay-700.woff2) format('woff2')}
@font-face{font-family:Clash;font-weight:600;src:url(../assets/fonts-site/ClashDisplay-600.woff2) format('woff2')}
@font-face{font-family:Satoshi;font-weight:500;src:url(../assets/fonts-site/Satoshi-500.woff2) format('woff2')}
@font-face{font-family:Satoshi;font-weight:700;src:url(../assets/fonts-site/Satoshi-700.woff2) format('woff2')}
@font-face{font-family:Fraunces;font-style:italic;src:url(../assets/fonts-mo5/Fraunces.woff2) format('woff2')}
:root{--bg0:#08070a;--o1:#ff5a1f;--o2:#ff8a4c;--o3:#ffb38a;--ink:#f6efe7;--mute:#a59a90}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg0)}
#stage{position:absolute;inset:0;overflow:hidden;color:var(--ink);font-family:Satoshi;-webkit-font-smoothing:antialiased;background:var(--bg0)}
.L{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px}
.abs{position:absolute;left:0;top:0}
.glow{position:absolute;border-radius:50%;mix-blend-mode:screen;pointer-events:none}
/* verre (MO5) */
.glass{position:absolute;border-radius:36px;background:linear-gradient(140deg,rgba(255,255,255,.20),rgba(255,255,255,.05) 45%,rgba(255,255,255,.08));
  -webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border:1.5px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -20px 40px rgba(0,0,0,.18),0 40px 80px rgba(0,0,0,.5);overflow:hidden}
.sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.2) 42%,transparent 54%);pointer-events:none}
.notif{width:780px;height:184px;display:flex;align-items:center;gap:26px;padding:22px 32px 22px 22px}
.notif canvas{width:186px;height:138px;border-radius:22px;flex:none;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.notif .app{font:500 22px Satoshi;color:rgba(246,239,231,.7);margin-bottom:6px;white-space:nowrap}
.notif .ti{font:700 34px Satoshi;white-space:nowrap}
.notif .am{font:700 54px Clash;font-variant-numeric:tabular-nums;white-space:nowrap}
.notif .am b{color:var(--o2)}
.cell{position:absolute;width:124px;height:172px;border-radius:24px}
.digit{position:absolute;left:0;top:0;width:124px;height:172px;overflow:hidden;border-radius:24px}
.digit .col{position:absolute;left:0;width:124px}
.digit .col span{display:block;height:172px;line-height:172px;text-align:center;font:700 128px Clash}
.digit::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,7,10,.7),transparent 26%,transparent 74%,rgba(8,7,10,.7))}
.flapT{position:absolute;width:132px;height:180px;border-radius:20px;display:flex;align-items:center;justify-content:center;font:700 128px Clash;transform-origin:50% 50%;backface-visibility:hidden}
.flapT i{position:absolute;left:0;right:0;top:50%;height:3px;background:rgba(0,0,0,.5)}
/* nouveau dans MO9 */
.stamp{position:absolute;padding:8px 22px 10px;border:4px solid var(--o2);border-radius:14px;font:700 34px Clash;color:var(--o3);letter-spacing:.04em;white-space:nowrap;
  box-shadow:0 0 22px rgba(255,110,40,.55),inset 0 0 14px rgba(255,110,40,.35);text-shadow:0 0 14px rgba(255,120,50,.6);background:rgba(8,7,10,.35);transform-origin:50% 50%}
.ad{position:absolute;width:152px;height:184px;border-radius:22px;padding:9px}
.ad canvas{display:block;width:134px;height:84px;border-radius:14px;filter:blur(2px) brightness(.8)}
.ad .p{font:700 34px Clash;margin-top:10px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.ad .k{font:500 18px Satoshi;color:rgba(246,239,231,.65);white-space:nowrap;text-align:center}
.ring{position:absolute;border-radius:24px;box-shadow:0 0 0 3px rgba(255,179,138,.95),0 0 40px rgba(255,110,40,.6);pointer-events:none}
.pill{position:absolute;padding:14px 26px;border-radius:999px;white-space:nowrap;font:700 32px Satoshi}
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(#fff,#ffb38a 40%,rgba(255,90,31,0) 70%);box-shadow:0 0 24px 8px rgba(255,110,40,.55)}
.sweep{position:absolute;width:90px;margin-left:-45px;background:linear-gradient(90deg,rgba(255,90,31,0),rgba(255,120,50,.25) 30%,rgba(255,236,220,.95) 48%,#fff 50%,rgba(255,236,220,.95) 52%,rgba(255,120,50,.25) 70%,rgba(255,90,31,0));
  -webkit-mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent);mix-blend-mode:screen;filter:blur(1px)}
.msg{position:absolute;padding:20px 30px;border-radius:34px 34px 34px 10px;white-space:nowrap;font:700 38px Satoshi}
.dec{position:absolute;left:110px;width:860px;height:268px;padding:30px 40px;display:flex;align-items:center;gap:34px}
.dec .num{font:700 150px Clash;line-height:1;width:96px;text-align:center;background:linear-gradient(180deg,#ffd2b8,var(--o2));-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,110,40,.45))}
.dec .t{font:700 46px Satoshi;white-space:nowrap}
.dec .s{font:500 32px Satoshi;color:rgba(246,239,231,.7);margin-top:4px;white-space:nowrap}
.dec .v{font:700 52px Clash;margin-top:10px;white-space:nowrap;color:var(--o3)}
.serif{font-family:Fraunces;font-style:italic;font-weight:500;background:linear-gradient(100deg,var(--o1),var(--o2) 55%,var(--o3));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .14em 0 .06em}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.085;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='9'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(85% 65% at 50% 45%,transparent 50%,rgba(0,0,0,.72))}
</style>
</head>
<body>
<div id="stage"></div>
<script src="../lib/motion.js"></script>
<script src="../lib/kit47.js"></script>
<script src="clio-contour.js"></script>
<script src="film.js"></script>
</body>
</html>

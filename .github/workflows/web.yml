# Vérifie le site à chaque PR et sur main : types puis lint.
# Une fusion qui garde deux versions d'un fichier (doublons, variables redéclarées) échoue ici au lieu de casser Vercel.
name: Site (types et lint)

on:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**"]

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npx eslint src
